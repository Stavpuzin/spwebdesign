<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =====================================================
   PAGES
===================================================== */

.page {
    display: none;

    position: relative;

    width: 100vw;
    min-height: 100vh;

    background: #000;

    overflow: hidden;
}

.page.active {
    display: block;
}

/*
   הסקיצה עצמה משמשת כרקע של העמוד,
   ולכן המראה נשמר בדיוק כמו התמונה.
*/

.page-image {
    display: block;

    width: 100vw;
    height: 100vh;

    object-fit: contain;
    object-position: center center;

    background: #000;
}

/* =====================================================
   INVISIBLE CLICK AREAS
===================================================== */

.hotspot {
    position: absolute;

    z-index: 100;

    display: block;

    border: none;

    background: transparent;

    cursor: pointer;

    text-decoration: none;
}

/* =====================================================
   TOP NAVIGATION
===================================================== */

.nav-home {
    left: 54%;
    top: 1%;

    width: 11%;
    height: 10%;
}

.nav-services {
    left: 43%;
    top: 1%;

    width: 12%;
    height: 10%;
}

.nav-process {
    left: 30%;
    top: 1%;

    width: 14%;
    height: 10%;
}

.nav-about {
    left: 20%;
    top: 1%;

    width: 10%;
    height: 10%;
}

.nav-contact {
    left: 6%;
    top: 1%;

    width: 14%;
    height: 10%;
}

/* =====================================================
   HOME BUTTONS
===================================================== */

    width: 22%;
    height: 12%;

.home-services {

    width: 22%;
    height: 12%;

/* =====================================================
   CONTACT BUTTONS
===================================================== */

    height: 34%;
}

.contact-email {

    top: 20%;

    width: 17%;
    height: 34%;
}

.contact-facebook {
    left: 38%;
    top: 20%;

    width: 17%;
    height: 34%;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .page {
        min-height: 0;

        width: 100vw;

        height: calc(100vw * 768 / 1206);
    }

    .page-image {
        width: 100vw;

        height: calc(100vw * 768 / 1206);

        min-height: 0;

        object-fit: fill;
    }

    .nav-home {
        left: 54%;
        top: 1%;
        width: 11%;
        height: 11%;
    }

    .nav-services {
        left: 43%;
        top: 1%;
        width: 12%;
        height: 11%;
    }

    .nav-process {
        left: 30%;
        top: 1%;
        width: 14%;
        height: 11%;

    .nav-about {
        left: 20%;

        width: 10%;
        height: 11%;
    }

    .nav-contact {
        left: 6%;
        top: 1%;
        width: 14%;
        height: 11%;
    }
}

</style>

<script>

/* =====================================================
   PAGE ROUTING
===================================================== */

function showPage(pageName) {

    const pages =
        document.querySelectorAll(".page");


    pages.forEach(function(page) {

        page.classList.remove("active");

    });


    const selectedPage =
        document.getElementById(pageName);


    if (selectedPage) {

        selectedPage.classList.add("active");

    }


    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

}


/* =====================================================
   URL ROUTING
===================================================== */

function loadPage() {

    let pageName =
        window.location.hash.replace("#", "");


    if (
        pageName !== "home" &&
        pageName !== "services" &&
        pageName !== "process" &&
        pageName !== "contact"
    ) {

        pageName = "home";

    }


    showPage(pageName);

}


/* =====================================================
   CLICK NAVIGATION
===================================================== */

document
    .querySelectorAll('a[href^="#"]')
    .forEach(function(link) {

        link.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                const target =
                    this.getAttribute("href")
                    .replace("#", "");


                history.pushState(
                    {},
                    "",
                    "#" + target
                );


                showPage(target);

            }
        );

    });


/* =====================================================
   BACK / FORWARD
===================================================== */

window.addEventListener(
    "popstate",
    loadPage
);


/* =====================================================
   INITIAL PAGE
===================================================== */

window.addEventListener(
    "load",
    loadPage
);

</script>
