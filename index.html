<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STAV PUZIN — Web Design Studio</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#000;
  color:#f4f0e8;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  height:76px;

  background:rgba(0,0,0,.92);

  backdrop-filter:blur(14px);

  border-bottom:
    1px solid rgba(216,169,73,.35);
}

nav{
  width:min(1100px,92%);
  height:100%;

  margin:auto;

  display:flex;
  align-items:center;

  gap:45px;
}

nav a{
  height:100%;

  display:flex;
  align-items:center;

  position:relative;

  color:#d8d2c9;

  font-size:16px;

  transition:.3s;
}

nav a:hover{
  color:#edc66c;
}

nav a.active{
  color:#edc66c;
}

nav a.active:after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:2px;

  background:#e3b95e;

  box-shadow:
    0 0 12px #e3b95e,
    0 0 25px rgba(227,185,94,.5);
}

.logo{
  width:75px;
  height:55px;

  object-fit:contain;

  margin-right:auto;
}


/* =========================
   GENERAL
========================= */

main{
  width:min(1100px,92%);

  margin:auto;
}

section{
  min-height:100vh;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:50px 0;

  scroll-margin-top:76px;
}

.section-image{
  width:100%;

  height:auto;

  display:block;

  animation:
    pageIn .8s ease both;

  filter:
    drop-shadow(
      0 0 25px
      rgba(215,170,75,.08)
    );
}

@keyframes pageIn{

  from{
    opacity:0;

    transform:
      translateY(25px);
  }

  to{
    opacity:1;

    transform:
      translateY(0);
  }

}


/* =========================
   GOLD LIGHT
========================= */

.light{
  position:fixed;

  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:900;
}

.light:after{

  content:"";

  position:absolute;

  top:-10%;
  left:-30%;

  width:18%;
  height:120%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,220,140,.08),
      transparent
    );

  transform:
    skewX(-18deg);

  animation:
    shine 8s ease-in-out infinite;
}

@keyframes shine{

  0%,
  65%{
    left:-30%;
    opacity:0;
  }

  72%{
    opacity:1;
  }

  90%,
  100%{
    left:120%;
    opacity:0;
  }

}


/* =========================
   GOLD PARTICLES
========================= */

.star{

  position:fixed;

  width:5px;
  height:5px;

  border-radius:50%;

  background:#f1c96e;

  box-shadow:
    0 0 12px
    4px rgba(241,201,110,.5);

  pointer-events:none;

  z-index:901;

  animation:
    pulse 3s
    ease-in-out
    infinite;
}

@keyframes pulse{

  0%,
  100%{
    opacity:.1;

    transform:
      scale(.6);
  }

  50%{
    opacity:1;

    transform:
      scale(1.4);
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  header{
    height:64px;
  }

  nav{
    gap:18px;
  }

  nav a{
    font-size:13px;
  }

  nav a:nth-child(2),
  nav a:nth-child(3){
    display:none;
  }

  .logo{
    width:62px;
  }

  main{
    width:94%;
  }

  section{
    min-height:auto;

    padding:
      30px 0;
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<nav>

<a
href="#home"
class="active"
>
ראשי
</a>

<a href="#services">
שירותים
</a>

<a href="#process">
תהליך עבודה
</a>

<a href="#about">
אודות
</a>

<a href="#contact">
יצירת קשר
</a>

<img
src="logo.png"
class="logo"
alt="STAV PUZIN"
>

</nav>

</header>



<!-- =========================
     EFFECTS
========================= -->

<div class="light"></div>

<div
class="star"
style="
top:15%;
left:8%;
"
></div>

<div
class="star"
style="
top:35%;
left:91%;
animation-delay:1s;
"
></div>

<div
class="star"
style="
top:58%;
left:13%;
animation-delay:1.7s;
"
></div>

<div
class="star"
style="
top:82%;
left:84%;
animation-delay:.6s;
"
></div>



<!-- =========================
     WEBSITE
========================= -->

<main>


<!-- =========================
     HOME
========================= -->

<section
id="home"
>

<img
src="home.jpg"
class="section-image"
alt="STAV PUZIN — ראשי"
>

</section>



<!-- =========================
     SERVICES
========================= -->

<section
id="services"
>

<img
src="services.jpg"
class="section-image"
alt="השירותים שלי"
>

</section>



<!-- =========================
     PROCESS
========================= -->

<section
id="process"
>

<img
src="process.jpg"
class="section-image"
alt="תהליך העבודה"
>

</section>



<!-- =========================
     ABOUT
========================= -->

<section
id="about"
>

<img
src="about.jpg"
class="section-image"
alt="אודות"
>

</section>



<!-- =========================
     CONTACT
========================= -->

<section
id="contact"
>

<img
src="contact.jpg"
class="section-image"
alt="יצירת קשר"
>

</section>


</main>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>

/* =========================
   ACTIVE MENU
========================= */

const links =
[
  ...document.querySelectorAll(
    "nav a"
  )
];


const sections =
[
  ...document.querySelectorAll(
    "main section"
  )
];


const observer =
new IntersectionObserver(

  entries => {

    entries.forEach(
      entry => {

        if(
          entry.isIntersecting
        ){

          links.forEach(
            link => {

              link.classList.toggle(

                "active",

                link.getAttribute(
                  "href"
                )
                ===
                "#"
                +
                entry.target.id

              );

            }

          );

        }

      }

  },

  {
    threshold:.45
  }

);


sections.forEach(
  section =>
    observer.observe(section)
);


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
  "load",
  () => {

    document.body.style.opacity =
      "0";

    requestAnimationFrame(
      () => {

        document.body.style.transition =
          "opacity .7s ease";

        document.body.style.opacity =
          "1";

      }
    );

  }
);

</script>


</body>
</html>
